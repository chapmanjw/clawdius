name: Clawdius Release

# Cut a release by pushing a tag, e.g.:
#   git tag v1.125.0-alpha1 && git push origin v1.125.0-alpha1
# Builds, signs (when the signing secrets are configured), and publishes per-platform
# assets to a GitHub Release. Signing is optional per leg: a leg runs UNSIGNED when its
# secrets are absent, so the pipeline goes green before any signing certs are in place.
#
# Build status: the Windows leg is first. The Linux (deb/rpm/tar/snap) and macOS
# (universal + notarized dmg) legs are added in follow-up commits. Until a leg has been
# proven on a real runner, validate it with a throwaway pre-release tag (v0.0.0-testN).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # Hosted runners, free for this public repo. windows-11-arm builds arm64 natively.
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    environment: release
    env:
      # Mapped from secrets so steps can gate on presence (secrets can't be used in if:).
      AZ_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZ_TRUSTED_SIGNING_ENDPOINT }}
      AZ_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZ_TRUSTED_SIGNING_ACCOUNT }}
      AZ_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZ_TRUSTED_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The hosted windows-2022 image ships VS2022 with the C++ workload + Spectre-
      # mitigated libs. If a future image drops them the native build fails MSB8040 and
      # this is where a Microsoft.VisualStudio.Component.VC.*.Spectre install would go.
      - name: Install dependencies
        run: npm ci
      - name: Add Windows SDK signtool to PATH
        shell: pwsh
        run: |
          # The gulp build (patchWin32Dependencies) strips Authenticode off prebuilt
          # native modules via signtool, which isn't on the hosted runner's default PATH.
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw 'signtool.exe not found under the Windows 10 Kits' }
          Split-Path $st.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "signtool: $($st.FullName)"
      - name: Set up Azure Trusted Signing
        if: ${{ env.AZ_TRUSTED_SIGNING_ENDPOINT != '' }}
        shell: pwsh
        run: |
          # Azure.CodeSigning dlib that signtool /dlib uses. Pin the version after a
          # validation run; see https://www.nuget.org/packages/Microsoft.Trusted.Signing.Client
          $pkg = Join-Path $env:RUNNER_TEMP 'tsclient'
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory $pkg -ExcludeVersion
          $dlib = (Get-ChildItem $pkg -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1).FullName
          "CLAWDIUS_SIGN_DLIB=$dlib"   >> $env:GITHUB_ENV
          "CLAWDIUS_SIGNTOOL=$signtool" >> $env:GITHUB_ENV
      - name: Build, package, sign
        shell: pwsh
        run: ./build/release/win32.ps1 -Arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: clawdius-win32-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    environment: release
    env:
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev fakeroot dpkg-dev rpm
      - name: Install dependencies
        run: npm ci
      - name: Import GPG key
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpgconf --reload gpg-agent || true
      - name: Build, package, sign
        run: bash ./build/release/linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: clawdius-linux-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  snap:
    name: Build Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    environment: release
    continue-on-error: true # snap is the flakiest leg; never block the release on it
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev fakeroot
      - name: Install dependencies
        run: npm ci
      - name: Build app + prepare snapcraft tree
        run: |
          npm run gulp vscode-linux-${{ matrix.arch }}-min
          npm run gulp vscode-linux-${{ matrix.arch }}-prepare-snap
      - uses: snapcore/action-build@v1
        id: snapbuild
        with:
          # gulp prepare-snap writes the snapcraft tree to .build/linux/snap/<arch>/<applicationName>-<arch>
          path: .build/linux/snap/${{ matrix.arch }}/clawdius-${{ matrix.arch }}
      - name: Collect snap
        run: |
          mkdir -p release-artifacts
          cp "${{ steps.snapbuild.outputs.snap }}" release-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: clawdius-snap-${{ matrix.arch }}
          path: release-artifacts/*
          if-no-files-found: error

  macos:
    name: Build macOS (universal)
    runs-on: macos-14
    environment: release
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Import signing cert + notarization key
        if: ${{ env.APPLE_CERT_P12 != '' }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/buildagent.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENT=$(security find-identity -p codesigning -v "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "CODESIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
          echo "AGENT_TEMPDIRECTORY=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/apikey.p8"
          echo "APPLE_API_KEY_P8_PATH=$RUNNER_TEMP/apikey.p8" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign, notarize, package
        run: bash ./build/release/darwin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clawdius-darwin-universal
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, linux, snap, macos]
    # Publish only on a tag push, once Windows + Linux + macOS succeed; snap is optional.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Keep each leg's signed SHA256SUMS-<platform>-<arch>.txt (+ .asc) intact rather
      # than merging, so the GPG/Authenticode verification stays valid per file.
      - name: List assets
        run: ls -la dist
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || startsWith(github.ref_name, 'v0.0.0') }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
