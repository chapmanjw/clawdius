name: CodeQL

# Clawdius uses CodeQL ADVANCED setup (this workflow) rather than GitHub's default setup, so scanning is
# scoped to Clawdius-owned code via .github/codeql/codeql-config.yml. Default setup must be disabled in the
# repo's Code security settings for this workflow to be the active scanner - the two cannot both run.
#
# Languages: javascript-typescript (the shipped product + build tooling), rust (the CLI), and actions
# (supply-chain scanning of the fork's own workflows). The inherited upstream languages that default setup
# picked up from tiny test fixtures - c-cpp, csharp, go, java-kotlin, python, ruby - are intentionally
# dropped as noise.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1' # weekly, Monday 03:23 UTC
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
