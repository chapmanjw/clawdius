name: Clawdius CI

# Clawdius runs its own CI. The inherited microsoft/vscode workflows were removed because they
# depend on Microsoft secrets, self-hosted runners, and the distro repo and fail on any fork.
# This minimal job validates the fork scaffolding and works on a private repo with no secrets.
# Phase 6 expands it into the full matrix (build, branding guard against the built product,
# network-egress guard, gitleaks).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fork-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # upstream LFS test caches 404 and are not needed; never smudge in CI
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Forbidden-content scanner is falsifiable (planted string must fail)
        shell: bash
        run: |
          set -e
          tmp=clawdius/__scan_selftest__
          mkdir -p "$tmp"
          printf 'const s = "GitHub Copilot";\n' > "$tmp/bad.ts"
          if node script/clawdius/scan-forbidden.ts "$tmp/bad.ts"; then
            echo "FAIL: scanner did not flag a planted Copilot string"; rm -rf "$tmp"; exit 1
          fi
          printf 'const s = "hello from clawd";\n' > "$tmp/good.ts"
          node script/clawdius/scan-forbidden.ts "$tmp/good.ts"
          rm -rf "$tmp"
          echo "scanner is falsifiable: flags planted Copilot string, passes a clean file"
      - name: Forbidden-content scan over Clawdius-owned + marked files
        shell: bash
        run: |
          set -e
          owned=$(git ls-files 'clawdius/**' 'script/clawdius/**' 'extensions/clawdius-*/**' docs/CHANGES_AGAINST_UPSTREAM.md docs/MERGING.md docs/BUILD.md docs/CONTRIBUTING.md docs/SECURITY.md 'README-CLAWDIUS*')
          # Discover in-place upstream edits by their begin-marker across ALL tracked files (built at
          # runtime so this workflow does not match itself). The scanner self-selects: it skips its own
          # source, scans owned files in full, and inspects only the marked regions of everything else, so
          # a marked edit anywhere is covered and the list cannot drift.
          begin="CLAWDIUS""-BEGIN"
          marked=$(git grep -lI "$begin" || true)
          node script/clawdius/scan-forbidden.ts $owned $marked
          echo "forbidden-content scan clean over Clawdius-owned + marked files"
      - name: No internal planning material in the source tree
        shell: bash
        run: |
          set -e
          # Internal planning docs belong in the private docs repo, never the public source tree. This whole-tree
          # guard closes the gap that let bare Clawdius-authored .md files (no begin-marker, outside the owned
          # globs) slip past the forbidden-content scan above.
          plandocs=$(git ls-files 'src/**/*-plan.md' 'src/**/roadmap*.md' || true)
          if [ -n "$plandocs" ]; then
            echo "ERROR: internal planning docs found under src/ (move them to the private docs repo):"; echo "$plandocs"; exit 1
          fi
          # Markers of the private multi-agent planning workflow must never appear in tracked content. Narrow to
          # the unambiguous process terms so ordinary phase/wave code comments do not trip. Exclude the scanner and
          # this workflow, which carry the literals by necessity.
          marker='super-planner|grill-with-docs|grill-me|council synthesis|[0-9][ -]?model council|Generated by super-planner'
          if git grep -InE "$marker" -- ':!script/clawdius/scan-forbidden.ts' ':!.github/workflows/clawdius-ci.yml'; then
            echo "ERROR: internal planning-process markers found in tracked content"; exit 1
          fi
          echo "no internal planning material in the source tree"
      - name: Fork scaffolding intact
        shell: bash
        run: |
          set -e
          for f in UPSTREAM_VERSION docs/MERGING.md docs/CHANGES_AGAINST_UPSTREAM.md docs/BUILD.md \
                   .gitleaks.toml .pre-commit-config.yaml clawdius/SECURITY-SCANNING.md \
                   script/clawdius/scan-forbidden.ts script/clawdius/diff-stat \
                   script/clawdius/branding-guard.ts script/clawdius/brand-ratchet.ts \
                   script/clawdius/brand-ratchet-baseline.json; do
            test -f "$f" || { echo "MISSING required fork file: $f"; exit 1; }
          done
          echo "Clawdius fork scaffolding intact; pinned upstream $(cat UPSTREAM_VERSION)"
      - name: Branding guard (Clawdius branding, Open VSX, no telemetry, Clawdius theme)
        run: node script/clawdius/branding-guard.ts
      - name: Brand ratchet (Copilot icon/string/asset may only shrink) + per-probe falsifiability
        shell: bash
        run: |
          set -e
          # The clean tree must pass first.
          node script/clawdius/brand-ratchet.ts
          # Each probe must trip the ratchet ON ITS OWN. A single batched run would only prove the UNION trips,
          # so a scope-narrowing regression (e.g. dropping 'cli' from ROOTS or '.rs' from TEXT_EXT) could leave
          # the other probes tripping and the self-test silently green. Probe each surface independently.
          probe_one() {
            printf '%s\n' "$2" > "$1"
            if node script/clawdius/brand-ratchet.ts >/dev/null; then
              echo "::error::brand-ratchet probe did not trip for $1 (a tracked Copilot surface is no longer guarded)"; rm -f "$1"; exit 1
            fi
            rm -f "$1"
          }
          probe_one src/__brand_ratchet_selftest__.ts 'export const x = Codicon.copilot;'
          probe_one src/__brand_ratchet_selftest__.md 'See GitHub Copilot docs.'
          probe_one extensions/__brand_ratchet_selftest__.json '{ "x": "a Copilot label" }'
          probe_one src/__brand_ratchet-copilot-selftest__.svg '<svg></svg>'
          probe_one cli/__brand_ratchet_selftest__.rs '// mentions GitHub Copilot'
          node script/clawdius/brand-ratchet.ts
          echo "brand ratchet is falsifiable PER PROBE (src icon, src non-.ts text, extensions, cli/.rs, asset name) and clean against baseline"

  # Type-checks the sources and runs the Clawdius unit tests in the browser mocha harness: the
  # no-default-account egress regression plus the workflow-store/transcript and Claude-CLI-plugin-discovery
  # suites. Targeted on purpose: --run loads only the named test files, not the full upstream suite (which
  # carries unrelated upstream tests). Kept as a separate job so the fast fork-hygiene checks are never
  # gated on the heavy dev install. Phase 6 broadens this to the full matrix.
  unit-test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # upstream LFS test caches 404 and are not needed; never smudge in CI
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native-module build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev
      - name: Install dependencies
        run: npm ci
      - name: Type-check sources (catches type regressions across the fork)
        run: npm run compile-check-ts-native
      - name: Transpile sources to out/
        run: node build/next/index.ts transpile
      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium
      - name: Clawdius defaultAccount regression test (browser unit harness)
        # Silent-green guard. The harness catches a failed module import, logs "BAD <file>", registers
        # zero tests, and still exits 0 — so a drifted --run path would pass the job without running the
        # test. Assert the compiled file exists, fail on a "BAD" load error, and require >=1 passing test.
        run: |
          test_js="out/vs/workbench/services/accounts/test/browser/defaultAccount.test.js"
          if [ ! -f "$test_js" ]; then echo "::error::compiled test missing ($test_js) — transpile path drift"; exit 1; fi
          node test/unit/browser/index.js --run "$test_js" --browser chromium 2>&1 | tee harness.log
          if grep -q "BAD " harness.log; then echo "::error::harness failed to load the test (silent-green guard tripped)"; exit 1; fi
          if ! grep -qE "[1-9][0-9]* passing" harness.log; then echo "::error::no tests ran (expected >=1 passing)"; exit 1; fi
          echo "regression test ran and passed"
      - name: Clawdius feature unit tests (workflow store/transcript, Claude CLI plugin discovery)
        # Same silent-green guards, per suite: assert the compiled file exists, fail on a "BAD" load error,
        # require >=1 passing and zero failing in each. Run separately so a load failure in one is attributed.
        run: |
          for t in \
            "out/vs/workbench/contrib/chat/test/common/claudeCliAgentPluginDiscovery.test.js" \
            "out/vs/platform/clawdius/test/common/clawdiusCliConfig.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPermissionMode.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusEffort.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPermissions.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusControlCenter.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusContextBudget.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusContextBudgetConfirm.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeMcpModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudePluginsModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeSkillValidation.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageData.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageProvider.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusUpdate.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageCapacityRefresh.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeControlTabsModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeControlCenterEditor.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageDashboardView.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusConfigActions.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPluginSetup.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageStatusEntry.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusHiddenSettings.test.js"; do
            if [ ! -f "$t" ]; then echo "::error::compiled test missing ($t) — transpile path drift"; exit 1; fi
            log="$(basename "$t").log"
            node test/unit/browser/index.js --run "$t" --browser chromium 2>&1 | tee "$log"
            if grep -q "BAD " "$log"; then echo "::error::harness failed to load $t (silent-green guard tripped)"; exit 1; fi
            if ! grep -qE "[1-9][0-9]* passing" "$log"; then echo "::error::no tests ran in $t"; exit 1; fi
            if grep -qE "[1-9][0-9]* failing" "$log"; then echo "::error::a Clawdius feature test failed in $t"; exit 1; fi
            echo "ok: $t"
          done
          echo "Clawdius feature unit tests passed"
      - name: Clawdius agent-host node tests (Claude agent + session lifecycle + merge-touched units)
        # Node (mocha) runner for the Claude agent-host path + the units this fork touches (CLI backend
        # resolution, the OTEL subprocess-env scrub, the commit changeset-operation removal). Same
        # silent-green guards as above: `node ... | tee` masks the runner exit code, so the grep on
        # passing/failing is the real gate - assert the file exists, require >=1 passing and zero failing.
        run: |
          for t in \
            "out/vs/platform/agentHost/test/node/claudeAgent.test.js" \
            "out/vs/platform/agentHost/test/node/agentService.test.js" \
            "out/vs/platform/agentHost/test/node/agentHostSessionTitleController.test.js" \
            "out/vs/platform/agentHost/test/node/claudeSdkOptions.test.js" \
            "out/vs/platform/agentHost/test/node/clawdiusCliSpawn.test.js" \
            "out/vs/platform/agentHost/test/node/agentHostChangesetOperationService.test.js" \
            "out/vs/platform/agentHost/test/node/sessionPermissions.test.js" \
            "out/vs/platform/agentHost/test/node/claudeMapSessionEvents.test.js" \
            "out/vs/platform/agentHost/test/node/claudeSubagentResolver.test.js"; do
            if [ ! -f "$t" ]; then echo "::error::compiled test missing ($t) — transpile path drift"; exit 1; fi
            log="$(basename "$t").node.log"
            node test/unit/node/index.js --run "$t" 2>&1 | tee "$log"
            if ! grep -qE "[1-9][0-9]* passing" "$log"; then echo "::error::no tests ran in $t"; exit 1; fi
            if grep -qE "[1-9][0-9]* failing" "$log"; then echo "::error::a Clawdius agent-host node test failed in $t"; exit 1; fi
            echo "ok: $t"
          done
          echo "Clawdius agent-host node tests passed"
