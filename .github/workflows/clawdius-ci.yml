name: Clawdius CI

# Clawdius runs its own CI. The inherited microsoft/vscode workflows were removed because they
# depend on Microsoft secrets, self-hosted runners, and the distro repo and fail on any fork.
# This minimal job validates the fork scaffolding and works on a private repo with no secrets.
# A later change expands it into the full matrix (build, branding guard against the built product,
# network-egress guard).

on:
  push:
    # main plus the branches where the fork surface is most likely to grow: upstream re-bases and
    # merge integration branches. The fork-diff ratchet must catch bloat here, before it reaches main.
    branches: [main, "upstream-*", "merge/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fork-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # upstream LFS test caches 404 and are not needed; never smudge in CI
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Forbidden-content scanner is falsifiable (planted string must fail)
        shell: bash
        run: |
          set -e
          tmp=clawdius/__scan_selftest__
          mkdir -p "$tmp"
          printf 'const s = "GitHub Copilot";\n' > "$tmp/bad.ts"
          if node script/clawdius/scan-forbidden.ts "$tmp/bad.ts"; then
            echo "FAIL: scanner did not flag a planted Copilot string"; rm -rf "$tmp"; exit 1
          fi
          printf 'const s = "hello from clawd";\n' > "$tmp/good.ts"
          node script/clawdius/scan-forbidden.ts "$tmp/good.ts"
          rm -rf "$tmp"
          echo "scanner is falsifiable: flags planted Copilot string, passes a clean file"
      - name: Spec-Kit artifact scan is falsifiable (a specs/ or .specify/ dir must fail)
        shell: bash
        run: |
          set -e
          # PREFLIGHT: this self-test plants and then rm -rf's these sentinel names. If any already exists in
          # the checkout, refuse to run - otherwise a genuinely committed root specs/ or .specify/ (the exact
          # Spec-Kit artifact) would be deleted by the cleanup below and masked. A pre-existing specs/.specify is
          # itself a Spec-Kit-artifact violation; __sk_selftest__ signals stale state. Fail loud either way.
          for s in specs .specify __sk_selftest__; do
            if [ -e "$s" ]; then echo "::error::\"$s\" already exists before the spec-kit self-test - a committed Spec-Kit artifact or stale state; refusing to run destructive self-test"; exit 1; fi
          done
          # the scanner must flag a Spec-Kit directory ANYWHERE in the public tree - at the
          # root AND nested. Root cases live at the repo root; nested cases go under a throwaway parent so
          # cleanup never touches a real tracked directory. Each must trip the scan (run with no file args).
          for d in specs .specify __sk_selftest__/docs/specs __sk_selftest__/deep/nest/.specify; do
            mkdir -p "$d" && printf 'internal\n' > "$d/artifact.md"
            if node script/clawdius/scan-forbidden.ts >/dev/null 2>&1; then
              echo "FAIL: scan did not flag a planted Spec-Kit $d/ directory"; rm -rf specs .specify __sk_selftest__; exit 1
            fi
            rm -rf specs .specify __sk_selftest__
          done
          # A nested Spec-Kit file passed as an explicit arg must also be flagged.
          if node script/clawdius/scan-forbidden.ts docs/specs/tasks.md >/dev/null 2>&1; then
            echo "FAIL: scan did not flag a nested Spec-Kit file argument"; exit 1
          fi
          node script/clawdius/scan-forbidden.ts
          echo "spec-kit artifact scan is falsifiable: flags root + nested specs/ and .specify/, clean when absent"
      - name: Forbidden-content scan over Clawdius-owned + marked files
        shell: bash
        run: |
          set -e
          owned=$(git ls-files 'clawdius/**' 'src/vs/workbench/contrib/clawdius/**' 'src/vs/platform/clawdius/**' 'src/vs/platform/agentHost/**' 'script/clawdius/**' 'test/clawdius/**' 'test/clawdius-e2e/**' 'extensions/clawdius-*/**' docs/CHANGES_AGAINST_UPSTREAM.md docs/MERGING.md docs/BUILD.md docs/CONTRIBUTING.md docs/SECURITY.md 'README-CLAWDIUS*')
          # Discover in-place upstream edits by their begin-marker across ALL tracked files (built at
          # runtime so this workflow does not match itself). The scanner self-selects: it skips its own
          # source, scans owned files in full, and inspects only the marked regions of everything else, so
          # a marked edit anywhere is covered and the list cannot drift.
          begin="CLAWDIUS""-BEGIN"
          marked=$(git grep -lI "$begin" || true)
          node script/clawdius/scan-forbidden.ts $owned $marked
          echo "forbidden-content scan clean over Clawdius-owned + marked files"
      - name: No internal planning material in the source tree
        shell: bash
        run: |
          set -e
          # Internal planning docs belong in the private docs repo, never the public source tree. This whole-tree
          # guard closes the gap that let bare Clawdius-authored .md files (no begin-marker, outside the owned
          # globs) slip past the forbidden-content scan above.
          plandocs=$(git ls-files 'src/**/*-plan.md' 'src/**/roadmap*.md' || true)
          if [ -n "$plandocs" ]; then
            echo "ERROR: internal planning docs found under src/ (move them to the private docs repo):"; echo "$plandocs"; exit 1
          fi
          # Markers of the private multi-agent planning workflow must never appear in tracked content. Narrow to
          # the unambiguous process terms so ordinary phase/wave code comments do not trip. Exclude the scanner and
          # this workflow, which carry the literals by necessity.
          marker='super-planner|grill-with-docs|grill-me|council synthesis|[0-9][ -]?model council|Generated by super-planner'
          if git grep -InE "$marker" -- ':!script/clawdius/scan-forbidden.ts' ':!.github/workflows/clawdius-ci.yml'; then
            echo "ERROR: internal planning-process markers found in tracked content"; exit 1
          fi
          echo "no internal planning material in the source tree"
      - name: Secret scan (gitleaks over Clawdius-authored paths)
        shell: bash
        run: |
          set -e
          # gitleaks over the Clawdius-authored trees only: catches a committed credential where new Clawdius code
          # lands, without the upstream VS Code tree's known example-token false positives. A working-tree scan, so
          # it needs no deep clone (the CI checkout is shallow). The local pre-commit hook scans staged files; this
          # is the CI backstop. node_modules/out/.build are excluded in .gitleaks.toml.
          GLV=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GLV}/gitleaks_${GLV}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          # Falsifiability: a real-shaped secret planted under a Clawdius TEST path MUST trip the gate. Proves the
          # test/ trees are actually scanned (the allowlist no longer blanket-exempts them, which had let a real
          # credential in a mock/test file slip). If the planted secret does not trip, the gate is dead - fail.
          probe=src/vs/workbench/contrib/clawdius/test/browser/__gitleaks_selftest__.test.ts
          printf 'const k = "sk-ant-api03-FAKE00000000000000000000000000";\n' > "$probe"
          if /tmp/gitleaks detect --no-git --source src/vs/workbench/contrib/clawdius --config .gitleaks.toml --redact --no-banner --exit-code 1 >/dev/null 2>&1; then
            rm -f "$probe"; echo "FAIL: gitleaks did not flag a planted secret in a Clawdius test path"; exit 1
          fi
          rm -f "$probe"
          echo "gitleaks falsifiability: a planted Clawdius-test secret correctly tripped the gate"
          # Second probe: prove Clawdius extension MANIFESTS are scanned. The blanket extensions/*/package.json path
          # exemption was removed (upstream aiKeys are allowlisted by VALUE), so a real credential in a Clawdius
          # extension package.json must now trip. Plant into a temp package.json under the extension dir, then remove.
          mdir=extensions/clawdius-chat/__gitleaks_probe__
          mkdir -p "$mdir"
          printf '{ "__probe": "sk-ant-api03-FAKE00000000000000000000000000" }\n' > "$mdir/package.json"
          if /tmp/gitleaks detect --no-git --source extensions/clawdius-chat --config .gitleaks.toml --redact --no-banner --exit-code 1 >/dev/null 2>&1; then
            rm -rf "$mdir"; echo "FAIL: gitleaks did not flag a planted secret in a Clawdius extension package.json"; exit 1
          fi
          rm -rf "$mdir"
          echo "gitleaks falsifiability: a planted Clawdius extension-manifest secret correctly tripped the gate"
          for d in src/vs/workbench/contrib/clawdius src/vs/platform/clawdius \
                   src/vs/platform/agentHost/node/claude extensions/clawdius-chat \
                   extensions/clawdius-themes script/clawdius docs; do
            [ -d "$d" ] || continue
            /tmp/gitleaks detect --no-git --source "$d" --config .gitleaks.toml --redact --no-banner --exit-code 1
          done
          echo "gitleaks: no secrets in Clawdius-authored paths"
      - name: Fork scaffolding intact
        shell: bash
        run: |
          set -e
          for f in UPSTREAM_VERSION docs/MERGING.md docs/CHANGES_AGAINST_UPSTREAM.md docs/BUILD.md \
                   .gitleaks.toml .pre-commit-config.yaml clawdius/SECURITY-SCANNING.md \
                   script/clawdius/scan-forbidden.ts script/clawdius/diff-stat \
                   script/clawdius/branding-guard.ts script/clawdius/brand-ratchet.ts \
                   script/clawdius/brand-ratchet-baseline.json; do
            test -f "$f" || { echo "MISSING required fork file: $f"; exit 1; }
          done
          echo "Clawdius fork scaffolding intact; pinned upstream $(cat UPSTREAM_VERSION)"
      - name: Fork-diff ratchet is falsifiable (over-baseline growth must trip) + clean on this tree
        shell: bash
        run: |
          set -e
          # The checkout is shallow and carries no upstream remote/tag, so make the pinned base commit
          # available by SHA (it is an ancestor of main, hence fetchable) before diffing against it.
          base=$(sed -n 's/^upstream_commit:[[:space:]]*//p' script/clawdius/fork-diff-baseline.txt | tr -d '[:space:]')
          if [ -z "$base" ]; then echo "::error::no upstream_commit recorded in fork-diff-baseline.txt"; exit 1; fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          # The current tree must be within the recorded baseline.
          bash script/clawdius/diff-stat --check
          # Falsifiability: shrink the baseline so the current surface exceeds it - the ratchet MUST trip.
          # (git diff compares committed trees, so a working-tree file cannot plant growth; move the ceiling.)
          cp script/clawdius/fork-diff-baseline.txt /tmp/fork-diff-baseline.bak
          sed -i 's/^baseline:.*/baseline: 1 files changed, 1 insertions(+), 0 deletions(-)/' script/clawdius/fork-diff-baseline.txt
          if bash script/clawdius/diff-stat --check >/dev/null 2>&1; then
            echo "::error::fork-diff ratchet did not trip when the surface exceeds the baseline"
            cp /tmp/fork-diff-baseline.bak script/clawdius/fork-diff-baseline.txt
            exit 1
          fi
          cp /tmp/fork-diff-baseline.bak script/clawdius/fork-diff-baseline.txt
          bash script/clawdius/diff-stat --check
          echo "fork-diff ratchet is falsifiable (over-baseline growth trips) and clean on the current tree"
      - name: Branding guard (Clawdius branding, Open VSX, no telemetry, Clawdius theme)
        run: node script/clawdius/branding-guard.ts
      - name: Recommended-extension namespace guard is falsifiable (GlassWorm)
        shell: bash
        run: |
          set -e
          # An unverified namespace in the recommendation set must trip the guard (supply-chain foothold).
          node -e "const fs=require('fs');let t=fs.readFileSync('.vscode/extensions.json','utf8');t=t.replace(/(\"recommendations\"\s*:\s*\[)/,'\$1\"evilpublisher.squatted-namespace\",');fs.writeFileSync('.vscode/extensions.json',t)"
          if node script/clawdius/branding-guard.ts >/dev/null 2>&1; then
            echo "FAIL: branding guard did not flag an unverified recommended-extension namespace"; git checkout -- .vscode/extensions.json; exit 1
          fi
          git checkout -- .vscode/extensions.json
          # A reinstated upstream marketplace recommendation list must trip the guard.
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.extensionTips={'ms-python.python':'py'};fs.writeFileSync('product.json',JSON.stringify(p,null,'\t'))"
          if node script/clawdius/branding-guard.ts >/dev/null 2>&1; then
            echo "FAIL: branding guard did not flag a reinstated extensionTips list"; git checkout -- product.json; exit 1
          fi
          git checkout -- product.json
          node script/clawdius/branding-guard.ts >/dev/null
          echo "recommended-extension namespace guard is falsifiable and clean after restore"
      - name: Brand ratchet (Copilot icon/string/asset may only shrink) + per-probe falsifiability
        shell: bash
        run: |
          set -e
          # The clean tree must pass first.
          node script/clawdius/brand-ratchet.ts
          # Each probe must trip the ratchet ON ITS OWN. A single batched run would only prove the UNION trips,
          # so a scope-narrowing regression (e.g. dropping 'cli' from ROOTS or '.rs' from TEXT_EXT) could leave
          # the other probes tripping and the self-test silently green. Probe each surface independently.
          probe_one() {
            printf '%s\n' "$2" > "$1"
            if node script/clawdius/brand-ratchet.ts >/dev/null; then
              echo "::error::brand-ratchet probe did not trip for $1 (a tracked Copilot surface is no longer guarded)"; rm -f "$1"; exit 1
            fi
            rm -f "$1"
          }
          probe_one src/__brand_ratchet_selftest__.ts 'export const x = Codicon.copilot;'
          probe_one src/__brand_ratchet_selftest__.md 'See GitHub Copilot docs.'
          probe_one extensions/__brand_ratchet_selftest__.json '{ "x": "a Copilot label" }'
          probe_one src/__brand_ratchet-copilot-selftest__.svg '<svg></svg>'
          probe_one cli/__brand_ratchet_selftest__.rs '// mentions GitHub Copilot'
          node script/clawdius/brand-ratchet.ts
          echo "brand ratchet is falsifiable PER PROBE (src icon, src non-.ts text, extensions, cli/.rs, asset name) and clean against baseline"

  # Type-checks the sources and runs the Clawdius unit tests in the browser mocha harness: the
  # no-default-account egress regression plus the workflow-store/transcript and Claude-CLI-plugin-discovery
  # suites. Targeted on purpose: --run loads only the named test files, not the full upstream suite (which
  # carries unrelated upstream tests). Kept as a separate job so the fast fork-hygiene checks are never
  # gated on the heavy dev install. Later work broadens this to the full matrix.
  unit-test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # upstream LFS test caches 404 and are not needed; never smudge in CI
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install native-module build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev
      - name: Install dependencies
        run: npm ci
      - name: Type-check sources (catches type regressions across the fork)
        run: npm run compile-check-ts-native
      - name: Transpile sources to out/
        run: node build/next/index.ts transpile
      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium
      - name: Clawdius defaultAccount regression test (browser unit harness)
        # Silent-green guard. The harness catches a failed module import, logs "BAD <file>", registers
        # zero tests, and still exits 0 — so a drifted --run path would pass the job without running the
        # test. Assert the compiled file exists, fail on a "BAD" load error, and require >=1 passing test.
        run: |
          test_js="out/vs/workbench/services/accounts/test/browser/defaultAccount.test.js"
          if [ ! -f "$test_js" ]; then echo "::error::compiled test missing ($test_js) — transpile path drift"; exit 1; fi
          node test/unit/browser/index.js --run "$test_js" --browser chromium 2>&1 | tee harness.log
          if grep -q "BAD " harness.log; then echo "::error::harness failed to load the test (silent-green guard tripped)"; exit 1; fi
          if ! grep -qE "[1-9][0-9]* passing" harness.log; then echo "::error::no tests ran (expected >=1 passing)"; exit 1; fi
          echo "regression test ran and passed"
      - name: Clawdius feature unit tests (workflow store/transcript, Claude CLI plugin discovery)
        # Same silent-green guards, per suite: assert the compiled file exists, fail on a "BAD" load error,
        # require >=1 passing and zero failing in each. Run separately so a load failure in one is attributed.
        run: |
          for t in \
            "out/vs/workbench/contrib/chat/test/common/claudeCliAgentPluginDiscovery.test.js" \
            "out/vs/platform/clawdius/test/common/clawdiusCliConfig.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPermissionMode.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusEffort.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPermissions.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusControlCenter.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusContextBudget.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusContextBudgetConfirm.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeMcpModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudePluginsModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeSkillValidation.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageData.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageProvider.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusUpdate.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageCapacityRefresh.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageAccount.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeControlTabsModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeControlCenterEditor.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageDashboardView.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusConfigActions.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPluginSetup.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeUsageStatusEntry.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusHiddenSettings.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeSandbox.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusEffectiveConfig.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusEffectiveConfigPayload.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusEffectiveConfigService.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeClaimsRegistry.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusModel.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusPreflight.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusSettingsMerge.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/clawdiusStarCount.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeReaderSeam.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeReaderSeamTranscript.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeReaderSeamReadOnly.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeReaderSeamFormats.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeFleetEnumeration.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeWorkflowEnumeration.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeWorkflowsView.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeWorkflowTranscriptEditor.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeWorkflowOwnership.test.js" \
            "out/vs/workbench/contrib/clawdius/test/browser/claudeWorkflowBadges.test.js"; do
            if [ ! -f "$t" ]; then echo "::error::compiled test missing ($t) — transpile path drift"; exit 1; fi
            log="$(basename "$t").log"
            node test/unit/browser/index.js --run "$t" --browser chromium 2>&1 | tee "$log"
            if grep -q "BAD " "$log"; then echo "::error::harness failed to load $t (silent-green guard tripped)"; exit 1; fi
            if ! grep -qE "[1-9][0-9]* passing" "$log"; then echo "::error::no tests ran in $t"; exit 1; fi
            if grep -qE "[1-9][0-9]* failing" "$log"; then echo "::error::a Clawdius feature test failed in $t"; exit 1; fi
            echo "ok: $t"
          done
          echo "Clawdius feature unit tests passed"
      - name: Clawdius agent-host node tests (Claude agent + session lifecycle + merge-touched units)
        # Node (mocha) runner for the Claude agent-host path + the units this fork touches (CLI backend
        # resolution, the OTEL subprocess-env scrub, the commit changeset-operation removal). Same
        # silent-green guards as above: `node ... | tee` masks the runner exit code, so the grep on
        # passing/failing is the real gate - assert the file exists, require >=1 passing and zero failing.
        run: |
          for t in \
            "out/vs/platform/agentHost/test/node/claudeAgent.test.js" \
            "out/vs/platform/agentHost/test/node/agentService.test.js" \
            "out/vs/platform/agentHost/test/node/agentHostSessionTitleController.test.js" \
            "out/vs/platform/agentHost/test/node/claudeSdkOptions.test.js" \
            "out/vs/platform/agentHost/test/node/clawdiusCliSpawn.test.js" \
            "out/vs/platform/agentHost/test/node/agentHostChangesetOperationService.test.js" \
            "out/vs/platform/agentHost/test/node/sessionPermissions.test.js" \
            "out/vs/platform/agentHost/test/node/claudeMapSessionEvents.test.js" \
            "out/vs/platform/agentHost/test/node/claudeSubagentResolver.test.js" \
            "out/vs/platform/agentHost/test/node/claudeTrustGate.test.js" \
            "out/vs/platform/agentHost/test/node/agentHostSecretRedact.test.js" \
            "out/vs/platform/agentHost/test/node/claudeMcpToolDiscoveryService.test.js" \
            "out/vs/platform/agentHost/test/node/claudeSdkPipeline.test.js" \
            "out/vs/platform/agentHost/test/common/claudeTrust.test.js" \
            "out/vs/platform/clawdius/test/node/claudeCredentials.test.js"; do
            if [ ! -f "$t" ]; then echo "::error::compiled test missing ($t) — transpile path drift"; exit 1; fi
            log="$(basename "$t").node.log"
            node test/unit/node/index.js --run "$t" 2>&1 | tee "$log"
            if ! grep -qE "[1-9][0-9]* passing" "$log"; then echo "::error::no tests ran in $t"; exit 1; fi
            if grep -qE "[1-9][0-9]* failing" "$log"; then echo "::error::a Clawdius agent-host node test failed in $t"; exit 1; fi
            echo "ok: $t"
          done
          echo "Clawdius agent-host node tests passed"

  clawdius-e2e-smoke:
    # Layer-2 e2e: drives the shipped Clawdius surfaces (status bar, Control Center, usage dashboard) through the
    # test/automation Electron driver so a broken native UI fails the build. Heavy (self-builds the app) and needs a
    # headless display, so it runs as its own job. The suite is auth-free + deterministic (see clawdius.test.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install build + headless-Electron prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libkrb5-dev libsecret-1-dev \
            xvfb libnss3 libgbm1 libgtk-3-0 libasound2t64 libatk-bridge2.0-0 libdrm2
      - name: Install dependencies
        run: npm ci
      - name: Clawdius e2e smoke suite (headless via xvfb)
        # Build in steps (not `npm run smoketest` in one shot) so we can fix the SUID chrome-sandbox for the
        # headless runner: Electron ABORTS unless .build/electron/chrome-sandbox is root:root mode 4755. Then
        # `-g` runs ONLY the Clawdius describe block. Auth-free + native-UI, deterministic without ~/.claude.
        run: |
          set -e
